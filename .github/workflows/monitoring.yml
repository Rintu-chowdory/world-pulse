name: World Pulse production monitoring

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-probe:
    name: Probe production services
    runs-on: ubuntu-latest
    env:
      WORLD_PULSE_API_URL: ${{ vars.WORLD_PULSE_API_URL || 'https://world-pulse-api.onrender.com' }}
      WORLD_PULSE_WEB_URL: ${{ vars.WORLD_PULSE_WEB_URL || 'https://world-pulse-web.pages.dev' }}
      MONITOR_ALERT_WEBHOOK_URL: ${{ secrets.MONITOR_ALERT_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show monitoring targets
        run: |
          echo "API target: $WORLD_PULSE_API_URL"
          echo "Web target: $WORLD_PULSE_WEB_URL"

      - name: Probe Render API and Cloudflare frontend
        id: probe
        run: bash scripts/check-production.sh

      - name: Send alert webhook
        if: failure() && env.MONITOR_ALERT_WEBHOOK_URL != ''
        env:
          ALERT_TEXT: "World Pulse production probe failed for commit ${{ github.sha }}. Review the GitHub Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          curl --fail-with-body --request POST "$MONITOR_ALERT_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --data "{\"text\":\"${ALERT_TEXT}\"}"
