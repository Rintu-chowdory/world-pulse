services:
  - type: web
    name: world-pulse-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REQUIRE_POSTGIS
        value: "true"
      - key: REQUIRE_REDIS
        value: "true"
      - key: ENABLE_LIVE_INGESTION
        value: "true"
      - key: ENABLE_AI_ENRICHMENT
        value: "true"
      - key: INGESTION_INTERVAL_SECONDS
        value: "60"
      - key: AI_WORKERS
        value: "2"
      - key: OPENAI_API_BASE
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: DB_POOL_MAX
        value: "10"
